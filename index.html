<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silhouette — guess the country</title>
<style>
:root{--bg:#0f1419;--card:#18202a;--line:#2a3542;--text:#e8eef5;--mute:#8b9aab;--accent:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;letter-spacing:.3px;flex:none}
h1 span{color:var(--accent)}
.hbtns{display:flex;gap:6px}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--mute)}
button.primary{background:var(--accent);color:#06210f;border-color:var(--accent);font-weight:700}
button.primary:disabled{opacity:.4;cursor:default}
button.on{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:5px;margin:0}
.tabs button{padding:6px 11px;font-size:14px;flex:none}
header{margin-bottom:10px}
.hbtns button{padding:6px 9px}
.shape{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:10px;display:flex;justify-content:center}
.shape svg{height:min(31vh,240px);width:auto;max-width:100%;aspect-ratio:3/2;overflow:visible;transition:transform .3s}
.shape path{fill:var(--text);stroke:var(--text);stroke-width:.6;stroke-linejoin:round;fill-rule:evenodd}
.rows{display:grid;gap:6px;margin-bottom:12px}
.entry{margin-bottom:2px}
.row{display:grid;grid-template-columns:1fr auto 34px 52px;gap:8px;align-items:center;border-radius:10px;padding:9px 11px;min-height:42px;background:var(--card);border:1px solid var(--line);font-size:15px}
.row.empty{background:transparent;border-style:dashed;opacity:.5}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .dist{color:var(--mute);font-variant-numeric:tabular-nums}
.row .arr{text-align:center;font-size:20px;line-height:1}
.row .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.row.win{border-color:var(--accent)}
.row .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:-2px}
.row .bar i{display:block;height:100%;background:var(--accent)}
.entry{position:relative}
.entry .frm{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:5;box-shadow:0 8px 24px #0008;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.sugg div{padding:8px 12px;cursor:pointer}
.sugg div.sel,.sugg div:hover{background:#243142}
.msg{min-height:20px;color:var(--warn);font-size:14px;margin:6px 2px}
.end{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px;text-align:center}
.end h2{margin:0 0 4px;font-size:20px}
.end .ans{font-size:26px;font-weight:800;margin:4px 0 10px}
.end .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
pre.share{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;white-space:pre-wrap;font:14px/1.3 ui-monospace,Menlo,monospace;margin:8px 0 0}
.hidden{display:none!important}
body.typing{overflow:hidden;position:fixed;inset:0;width:100%}
body.typing .foot,body.typing header{display:none}
html{overscroll-behavior:none}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04);box-shadow:0 0 0 4px #4ade8055}100%{transform:scale(1)}}
.row.win{animation:pop .6s ease 2;background:#16301f}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px;margin-bottom:14px}
.stats b{display:block;font-size:24px}
.stats small{color:var(--mute)}
.dist-row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:14px}
.dist-row .n{width:12px;color:var(--mute)}
.dist-row .b{background:var(--line);border-radius:3px;padding:1px 6px;min-width:22px;text-align:right;font-weight:700}
.dist-row .b.hl{background:var(--accent);color:#06210f}
label.opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.foot{color:var(--mute);font-size:12px;text-align:center;margin-top:18px}
@media (max-width:350px){header{flex-wrap:wrap}}
@media (max-width:380px){.row{grid-template-columns:1fr auto 28px 46px;font-size:14px;padding:8px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Silhou<span>ette</span></h1>
    <div class="tabs" role="tablist">
      <button id="tabDaily" class="on">Daily</button>
      <button id="tabRandom">Random</button>
    </div>

    <div class="hbtns">
      <button id="btnStats" aria-label="Statistics">📊</button>
      <button id="btnSet" aria-label="Settings">⚙️</button>
    </div>
  </header>
  <div class="shape"><svg id="svg" viewBox="0 0 300 200" role="img" aria-label="Country silhouette"><path id="shp" d=""/></svg></div>
  <div class="entry" id="entry">
    <div class="sugg hidden" id="sugg" role="listbox"></div>
    <div class="frm" id="frm">
      <input type="text" id="inp" name="sil-guess" placeholder="Type your guess…" aria-label="Your guess" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" data-1p-ignore data-lpignore="true">
      <button class="primary" id="go" type="button">Guess</button>
    </div>
  </div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="rows" id="rows"></div>
  <div class="end hidden" id="end">
    <h2 id="endTitle"></h2>
    <div class="ans" id="endAns"></div>
    <div id="endSub" style="color:var(--mute);font-size:14px"></div>
    <pre class="share" id="shareTxt"></pre>
    <div class="btns">
      <button class="primary" id="btnShare">Copy result</button>
      <button id="btnNext">Play a random one</button>
    </div>
  </div>
  <div class="foot">No ads. No tracking. Everything stays in your browser.<br>Map data: Natural Earth (public domain).</div>
</div>

<div class="modal hidden" id="mStats"><div class="box">
  <h2>Statistics (daily)</h2>
  <div class="stats">
    <div><b id="sP">0</b><small>Played</small></div>
    <div><b id="sW">0</b><small>Win %</small></div>
    <div><b id="sS">0</b><small>Streak</small></div>
    <div><b id="sM">0</b><small>Max</small></div>
  </div>
  <div id="sDist"></div>
  <div style="text-align:right;margin-top:14px"><button class="closeBtn">Close</button></div>
</div></div>

<div class="modal hidden" id="mSet"><div class="box">
  <h2>Settings</h2>
  <label class="opt"><span>Distance unit</span><button id="optUnit">km</button></label>
  <label class="opt"><span>Rotate shape (harder)</span><button id="optRot">Off</button></label>
  <div style="text-align:right;margin-top:14px"><button class="closeBtn">Close</button></div>
</div></div>

<script>
(function(){
"use strict";
var MAX=6, EARTH=6371, HALF=20000;
var C=[], byNorm={}, order=[];
var S={mode:'daily',idx:0,guesses:[],over:false,won:false,date:''};
var P={unit:'km',rot:false};
var $=function(id){return document.getElementById(id)};

function lsGet(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
var ALIAS={'usa':'United States','us':'United States','america':'United States','united states of america':'United States','uk':'United Kingdom','britain':'United Kingdom','great britain':'United Kingdom','england':'United Kingdom','uae':'United Arab Emirates','emirates':'United Arab Emirates','ivory coast':'Côte d\'Ivoire','czech republic':'Czechia','swaziland':'Eswatini','burma':'Myanmar','drc':'DR Congo','democratic republic of the congo':'DR Congo','congo kinshasa':'DR Congo','republic of the congo':'Congo','congo brazzaville':'Congo','east timor':'Timor-Leste','cape verde':'Cabo Verde','macedonia':'North Macedonia','holland':'Netherlands','turkiye':'Turkey','car':'Central African Republic','bosnia':'Bosnia and Herzegovina','korea':'South Korea','republic of korea':'South Korea','russian federation':'Russia','vatican':'Vatican City','holy see':'Vatican City','st lucia':'Saint Lucia','st kitts and nevis':'Saint Kitts and Nevis','st vincent and the grenadines':'Saint Vincent and the Grenadines','png':'Papua New Guinea','sao tome and principe':'São Tomé and Príncipe','palestinian territories':'Palestine','the gambia':'Gambia','the bahamas':'Bahamas'};

function toRad(x){return x*Math.PI/180}
function dist(a,b){
  var dLat=toRad(b.lat-a.lat),dLon=toRad(b.lon-a.lon);
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*EARTH*Math.asin(Math.min(1,Math.sqrt(h)));
}
function bearing(a,b){
  var y=Math.sin(toRad(b.lon-a.lon))*Math.cos(toRad(b.lat));
  var x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lon-a.lon));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
var ARROWS=['⬆️','↗️','➡️','↘️','⬇️','↙️','⬅️','↖️'];
function arrow(a,b){return ARROWS[Math.round(bearing(a,b)/45)%8]}
function prox(d){return Math.max(0,Math.round((1-d/HALF)*100))}
function fmt(d){
  var v=P.unit==='km'?d:d*0.621371;
  return Math.round(v).toLocaleString()+' '+P.unit;
}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildOrder(){
  var r=mulberry(20261124),a=C.map(function(_,i){return i});
  for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  order=a;
}
function today(){
  var d=new Date();
  var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);
  return {str:y+'-'+m+'-'+dd,num:Math.floor(Date.UTC(y,d.getMonth(),d.getDate())/86400000)};
}

function setShape(){
  $('shp').setAttribute('d',C[S.idx].d);
  $('shp').style.strokeWidth=C[S.idx].sw||0.6;
  var ang=0;
  if(P.rot){var r=mulberry(S.idx*977+(S.mode==='daily'?7:Date.now()%1000));ang=Math.round(r()*360)}
  $('svg').style.transform=ang?'rotate('+ang+'deg)':'';
}

function startDaily(){
  var t=today();
  S={mode:'daily',idx:order[t.num%C.length],guesses:[],over:false,won:false,date:t.str};
  var saved=lsGet('sil-day-'+t.str,null);
  if(saved&&saved.idx===S.idx){S.guesses=saved.guesses;S.over=saved.over;S.won=saved.won}
  setMode();
}
function startRandom(){
  var prev=S.idx,i;
  do{i=Math.floor(Math.random()*C.length)}while(i===prev&&C.length>1);
  S={mode:'random',idx:i,guesses:[],over:false,won:false,date:''};
  setMode();
}
function setMode(){
  $('tabDaily').classList.toggle('on',S.mode==='daily');
  $('tabRandom').classList.toggle('on',S.mode==='random');
  $('msg').textContent='';$('inp').value='';hideSugg();
  setShape();render();
  if(!S.over)$('inp').focus();
}
function save(){if(S.mode==='daily')lsSet('sil-day-'+S.date,{idx:S.idx,guesses:S.guesses,over:S.over,won:S.won})}

function render(){
  var rows=$('rows');rows.innerHTML='';
  var T=C[S.idx];
  for(var k=0;k<MAX;k++){
    var el=document.createElement('div');
    var i=S.guesses.length-1-k; /* newest first */
    if(i>=0){
      var g=C[S.guesses[i]],d=dist(g,T),ok=S.guesses[i]===S.idx,p=ok?100:Math.min(99,prox(d));
      el.className='row'+(ok?' win':'');
      el.innerHTML='<span class="nm"></span><span class="dist">'+(ok?'':fmt(d))+'</span><span class="arr">'+(ok?'🎉':arrow(g,T))+'</span><span class="pct">'+p+'%</span><span class="bar"><i style="width:'+p+'%"></i></span>';
      el.querySelector('.nm').textContent=g.n;
    }else{el.className='row empty';el.innerHTML='<span class="nm">&nbsp;</span>'}
    rows.appendChild(el);
  }
  if(S.over){document.body.classList.remove('typing');try{$('inp').blur()}catch(e){}window.scrollTo(0,0)}
  $('entry').classList.toggle('hidden',S.over);
  $('msg').classList.toggle('hidden',S.over);
  var end=$('end');
  if(S.over){
    end.classList.remove('hidden');
    $('endTitle').textContent=S.won?('Got it in '+S.guesses.length+'/'+MAX+'!'):'Out of guesses';
    $('endAns').textContent=T.n;
    $('endSub').textContent=S.mode==='daily'?'Come back tomorrow for a new one, or play random ones now.':'Nice. Play another?';
    $('shareTxt').textContent=shareText();
  }else end.classList.add('hidden');
}

function shareText(){
  var T=C[S.idx];
  var head='Silhouette '+(S.mode==='daily'?S.date:'(random)')+' '+(S.won?S.guesses.length:'X')+'/'+MAX;
  var lines=S.guesses.map(function(gi){
    var ok=gi===S.idx,p=ok?100:prox(dist(C[gi],T)),n=Math.round(p/20),s='';
    for(var k=0;k<5;k++)s+=k<n?'🟩':'⬛';
    return s+' '+(ok?'🎉':arrow(C[gi],T));
  });
  return head+'\n'+lines.join('\n');
}

/* autocomplete */
var matches=[],sel=-1;
function hideSugg(){$('sugg').classList.add('hidden');matches=[];sel=-1}
function updateSugg(){
  var q=norm($('inp').value);
  if(!q){hideSugg();return}
  var starts=[],incl=[];
  C.forEach(function(c,i){
    var n=norm(c.n);
    if(n.indexOf(q)===0)starts.push(i);else if(n.indexOf(q)>0)incl.push(i);
  });
  Object.keys(ALIAS).forEach(function(a){
    if(a.indexOf(q)===0&&q.length>=2){var i=byNorm[norm(ALIAS[a])];if(i!==undefined&&starts.indexOf(i)<0&&incl.indexOf(i)<0)starts.push(i)}
  });
  matches=starts.concat(incl).slice(0,15);sel=matches.length?0:-1;
  drawSugg();
}
function drawSugg(){
  var s=$('sugg');
  if(!matches.length){s.classList.add('hidden');return}
  var vh=Math.min(window.visualViewport?window.visualViewport.height:window.innerHeight,window.innerHeight*0.6);
  var eb=$('entry').getBoundingClientRect().bottom;
  s.style.maxHeight=Math.min(230,Math.max(76,vh-eb-10))+'px';
  s.innerHTML='';
  matches.forEach(function(i,k){
    var d=document.createElement('div');d.textContent=C[i].n;d.setAttribute('role','option');
    if(k===sel)d.className='sel';
    d.addEventListener('mousedown',function(e){e.preventDefault()});
    d.addEventListener('click',function(){$('inp').value=C[i].n;hideSugg();submit();$('inp').focus()});
    s.appendChild(d);
  });
  s.classList.remove('hidden');
}
function resolve(text){
  var n=norm(text);if(!n)return -1;
  if(byNorm[n]!==undefined)return byNorm[n];
  if(ALIAS[n]){var i=byNorm[norm(ALIAS[n])];if(i!==undefined)return i}
  return -1;
}
function submit(){
  if(S.over)return;
  var idx=-1;
  if(sel>=0&&matches.length)idx=matches[sel];
  if(idx<0)idx=resolve($('inp').value);
  if(idx<0){flash('Pick a country from the list');return}
  if(S.guesses.indexOf(idx)>=0){flash('Already guessed');return}
  S.guesses.push(idx);
  if(idx===S.idx){S.over=true;S.won=true}
  else if(S.guesses.length>=MAX){S.over=true;S.won=false}
  $('inp').value='';hideSugg();$('msg').textContent='';
  save();
  if(S.over&&S.mode==='daily')recordStats();
  render();
  if(S.over){$('svg').style.transform='';}
  if(S.over&&S.won){confetti();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
}
function flash(t){$('msg').textContent=t}

/* confetti */
function confetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var old=document.getElementById('confetti');if(old)old.remove();
  var cv=document.createElement('canvas');cv.id='confetti';document.body.appendChild(cv);
  var dpr=window.devicePixelRatio||1,W=window.innerWidth,H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  var cx=cv.getContext('2d');cx.scale(dpr,dpr);
  var colors=['#4ade80','#fbbf24','#60a5fa','#f472b6','#f87171','#e8eef5'],ps=[];
  for(var i=0;i<150;i++){
    var fromLeft=i%2===0;
    ps.push({x:W/2+(Math.random()-.5)*W*.6,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,
      w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,
      c:colors[i%colors.length]});
  }
  var t0=performance.now();
  (function tick(now){
    var el=now-t0;cx.clearRect(0,0,W,H);
    ps.forEach(function(p){
      p.vy+=.35;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      cx.save();cx.globalAlpha=Math.max(0,Math.min(1,(3200-el)/700));
      cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    });
    if(el<3200)requestAnimationFrame(tick);else cv.remove();
  })(t0);
}

/* stats */
function recordStats(){
  var st=lsGet('sil-stats',{played:0,wins:0,streak:0,max:0,dist:[0,0,0,0,0,0],last:''});
  if(st.last===S.date)return;
  st.played++;
  if(S.won){st.wins++;st.dist[S.guesses.length-1]++;
    var y=new Date(Date.now()-86400000),ys=y.getFullYear()+'-'+('0'+(y.getMonth()+1)).slice(-2)+'-'+('0'+y.getDate()).slice(-2);
    st.streak=(st.last===ys||st.streak===0)?st.streak+1:1;
    st.max=Math.max(st.max,st.streak);
  }else st.streak=0;
  st.last=S.date;lsSet('sil-stats',st);
}
function showStats(){
  var st=lsGet('sil-stats',{played:0,wins:0,streak:0,max:0,dist:[0,0,0,0,0,0]});
  $('sP').textContent=st.played;$('sW').textContent=st.played?Math.round(st.wins/st.played*100):0;
  $('sS').textContent=st.streak;$('sM').textContent=st.max;
  var mx=Math.max.apply(null,st.dist.concat([1])),h='';
  var cur=(S.mode==='daily'&&S.over&&S.won)?S.guesses.length-1:-1;
  st.dist.forEach(function(n,i){
    h+='<div class="dist-row"><span class="n">'+(i+1)+'</span><span class="b'+(i===cur?' hl':'')+'" style="width:'+Math.max(8,n/mx*100)+'%">'+n+'</span></div>';
  });
  $('sDist').innerHTML=h;
  $('mStats').classList.remove('hidden');
}

/* settings */
function applyPrefs(){$('optUnit').textContent=P.unit;$('optRot').textContent=P.rot?'On':'Off';lsSet('sil-prefs',P)}

function wire(){
  $('inp').addEventListener('input',updateSugg);
  $('inp').addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'&&matches.length){e.preventDefault();sel=(sel+1)%matches.length;drawSugg()}
    else if(e.key==='ArrowUp'&&matches.length){e.preventDefault();sel=(sel-1+matches.length)%matches.length;drawSugg()}
    else if(e.key==='Escape')hideSugg();
    else if(e.key==='Enter'){e.preventDefault();submit()}
  });
  function top(){window.scrollTo(0,0)}
  $('inp').addEventListener('focus',function(){document.body.classList.add('typing');top();setTimeout(top,60);setTimeout(top,300)});
  $('inp').addEventListener('blur',function(){setTimeout(function(){hideSugg();if(document.activeElement!==$('inp')){document.body.classList.remove('typing');top()}},120)});
  if(window.visualViewport){var vv=function(){if(document.body.classList.contains('typing'))top()};window.visualViewport.addEventListener('scroll',vv);window.visualViewport.addEventListener('resize',vv)}
  $('go').addEventListener('click',function(){submit()});
  $('tabDaily').addEventListener('click',startDaily);
  $('tabRandom').addEventListener('click',startRandom);
  $('btnNext').addEventListener('click',startRandom);
  $('btnStats').addEventListener('click',showStats);
  $('btnSet').addEventListener('click',function(){$('mSet').classList.remove('hidden')});
  Array.prototype.forEach.call(document.querySelectorAll('.closeBtn'),function(b){b.addEventListener('click',function(){$('mStats').classList.add('hidden');$('mSet').classList.add('hidden')})});
  Array.prototype.forEach.call(document.querySelectorAll('.modal'),function(m){m.addEventListener('click',function(e){if(e.target===m)m.classList.add('hidden')})});
  $('optUnit').addEventListener('click',function(){P.unit=P.unit==='km'?'mi':'km';applyPrefs();render()});
  $('optRot').addEventListener('click',function(){P.rot=!P.rot;applyPrefs();setShape()});
  $('btnShare').addEventListener('click',function(){
    var t=shareText(),b=$('btnShare');
    var done=function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy result'},1500)};
    try{navigator.clipboard.writeText(t).then(done,function(){b.textContent='Select the text above'})}catch(e){b.textContent='Select the text above'}
  });
}

fetch('countries.json').then(function(r){return r.json()}).then(function(data){
  C=data;
  C.forEach(function(c,i){byNorm[norm(c.n)]=i});
  buildOrder();
  var p=lsGet('sil-prefs',null);if(p){P.unit=p.unit==='mi'?'mi':'km';P.rot=!!p.rot}
  applyPrefs();wire();startDaily();
}).catch(function(e){$('msg').textContent='Could not load map data.'});
})();
</script>
